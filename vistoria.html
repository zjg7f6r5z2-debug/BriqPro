<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex"/>
<title>Vistoria de entrega</title>
<link rel="icon" href="icon-192.png"/>
<style>
:root{--bg:#07090B;--surface:#0F1316;--surface2:#161B1F;--border:#232A2F;--text:#EEF2F0;--text2:#9AA6A0;--text3:#6B7670;--brand:#01E377;--loss:#F07B7B;--amber:#F2B84B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(34px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;color:var(--text2);font-size:13px}.top b{color:var(--text)}
.logo{width:34px;height:34px;border-radius:10px;background:rgba(1,227,119,.14);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
h1{font-size:24px;margin:16px 0 4px;letter-spacing:-.4px;line-height:1.15}
.sub{color:var(--text2);font-size:13.5px;line-height:1.5}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;margin-top:14px}
h2{font-size:15px;margin:24px 0 0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}h2 small{font-size:12px;color:var(--text3);font-weight:500}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.kv span{display:block;font-size:11.5px;color:var(--text2)}.kv b{display:block;font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.it{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}.it:last-child{border-bottom:0;padding-bottom:0}.it:first-child{padding-top:0}
.ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0;background:rgba(1,227,119,.16);color:var(--brand)}
.ic.prob{background:rgba(242,184,75,.16);color:var(--amber)}
.it .t{font-size:14px;line-height:1.4}.it .o{font-size:12.5px;color:var(--amber);margin-top:2px}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gal figure{margin:0;min-width:0}.gal .m{border-radius:14px;overflow:hidden;background:var(--surface2);aspect-ratio:4/5;position:relative}
.gal img,.gal video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.gal figcaption{font-size:12px;color:var(--text2);margin-top:5px;line-height:1.35}
.tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;pointer-events:none}
.fld{display:block;font-size:12px;font-weight:700;color:var(--text2);margin:14px 0 6px}
.inp{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:13px;font-size:16px}
.decl{display:flex;gap:11px;align-items:flex-start;background:rgba(1,227,119,.08);border:1px solid rgba(1,227,119,.3);border-radius:14px;padding:13px;margin-top:14px;font-size:13.5px;line-height:1.5;cursor:pointer}
.decl input{width:20px;height:20px;accent-color:var(--brand);flex-shrink:0;margin-top:1px}
.pad{display:block;width:100%;height:170px;background:#fff;border-radius:14px;touch-action:none;margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center}
.lnk{background:none;border:0;color:var(--brand);font-weight:700;font-size:13px;cursor:pointer;padding:0}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:15.5px;cursor:pointer;background:var(--brand);color:#03170C;margin-top:16px}
.btn:disabled{opacity:.6}
.btn.gh{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.err{color:var(--loss);font-size:13px;margin-top:10px;min-height:18px}
.ok{text-align:center;padding:22px 14px}.ok .ck{width:58px;height:58px;border-radius:50%;background:rgba(1,227,119,.16);color:var(--brand);display:grid;place-items:center;font-size:28px;font-weight:800;margin:0 auto 10px}
.sig{display:block;max-width:260px;width:100%;margin:12px auto 0;background:#fff;border-radius:12px;padding:6px}
.state{text-align:center;color:var(--text2);padding:90px 20px}
.skel{height:180px;border-radius:18px;background:linear-gradient(90deg,var(--surface),var(--surface2),var(--surface));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:14px}
.lb.open{display:flex}.lb img{max-width:100%;max-height:100%;border-radius:10px}
.foot{text-align:center;color:var(--text3);font-size:11px;margin-top:28px}.foot b{color:var(--brand)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="skel"></div></div>
<div class="lb" id="lb" onclick="this.classList.remove('open')"><img id="lbimg" alt=""/></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://qkrrngvedziaijpnssjw.supabase.co';
const SUPABASE_KEY='sb_publishable_VLkwob7uJicbpe4FFRa3xw_fgN4Kv0W';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false}});
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>'R$ '+(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const dt=s=>new Date(s).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
let TOK='',D=null,padEmpty=true;
function decl(temProb){return 'Declaro que recebi o produto descrito nesta página, que conferi os testes registrados, com as fotos e os vídeos do funcionamento feitos antes da entrega, e que o produto está em perfeito estado de funcionamento e conservação, de acordo com o descrito'+(temProb?', incluídas as observações registradas':'')+', nada tendo a reclamar quanto ao estado verificado na entrega.';}
function render(){
  const P=D.produto||{},I=(D.itens||[]).filter(i=>i.s!=='pend'),M=D.midias||[];const temProb=I.some(i=>i.s==='prob');const loja=(D.loja&&D.loja.nome)||'Vendedor';
  const ini=loja.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  let h=`<div class="top"><div class="logo">${esc(ini)}</div><div><b>${esc(loja)}</b><br>Vistoria de entrega · ${dt(D.criado_em).slice(0,10)}</div></div>
  <h1>${esc(P.nome||D.titulo||'Produto')}</h1><div class="sub">Confira abaixo os testes feitos no produto antes da entrega, com fotos e vídeos do funcionamento.${D.assinado?'':' No final, assine para confirmar.'}</div>
  <div class="card kv">${[['Marca e modelo',P.marca],['IMEI / nº de série',P.serie],['Cor',P.cor],['Condição',P.condicao],['Valor',P.preco?brl(P.preco):'']].filter(x=>x[1]).map(x=>`<div><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('')||'<div><span>Produto</span><b>'+esc(P.nome||'')+'</b></div>'}</div>
  <h2>Testes realizados<small>${I.filter(i=>i.s==='ok').length} aprovado(s)${temProb?' · '+I.filter(i=>i.s==='prob').length+' com observação':''}</small></h2>
  <div class="card">${I.map(i=>`<div class="it"><div class="ic ${i.s==='prob'?'prob':''}">${i.s==='prob'?'!':'✓'}</div><div style="min-width:0"><div class="t">${esc(i.t)}</div>${i.s==='prob'?`<div class="o">${esc(i.obs||'Observação registrada pelo vendedor')}</div>`:''}</div></div>`).join('')||'<div class="sub">Nenhum teste registrado.</div>'}</div>`;
  if(M.length)h+=`<h2>Fotos e vídeos<small>${M.length} arquivo(s)</small></h2><div class="card gal">${M.map((m,k)=>`<figure><div class="m">${m.tipo==='video'?`<video src="${esc(m.url)}#t=0.3" controls playsinline preload="metadata"></video><span class="tag">vídeo</span>`:`<img src="${esc(m.url)}" alt="${esc(m.legenda||'Foto')}" loading="lazy" onclick="zoom(${k})">`}</div>${m.legenda?`<figcaption>${esc(m.legenda)}</figcaption>`:''}</figure>`).join('')}</div>`;
  if(D.obs)h+=`<h2>Acessórios e observações</h2><div class="card sub" style="white-space:pre-wrap;color:var(--text)">${esc(D.obs)}</div>`;
  if(D.assinado){h+=`<div class="card ok"><div class="ck">✓</div><b style="font-size:17px">Vistoria assinada</b><div class="sub" style="margin-top:4px">por ${esc(D.comprador_nome||'')} em ${dt(D.assinado_em)}</div>${D.assinatura?`<img class="sig" src="${D.assinatura}" alt="Assinatura">`:''}${D.hash?`<div style="font-size:11px;color:var(--text3);margin-top:10px">Código de verificação ${esc(String(D.hash).slice(0,16).toUpperCase().match(/.{4}/g).join('-'))}</div>`:''}</div>`;}
  else{h+=`<h2>Assinatura do comprador</h2><div class="card">
    <label class="fld" style="margin-top:0">Nome completo</label><input class="inp" id="nome" autocomplete="name" value="${esc(D.comprador_nome||'')}">
    <label class="fld">CPF (opcional)</label><input class="inp" id="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" oninput="mascara(this)">
    <label class="decl"><input type="checkbox" id="ok"><span>${esc(decl(temProb))}</span></label>
    <div class="row" style="margin-top:14px"><span class="fld" style="margin:0">Assine com o dedo</span><button class="lnk" onclick="limpar()">Limpar</button></div>
    <canvas class="pad" id="pad"></canvas>
    <div class="err" id="err"></div>
    <button class="btn" id="bt" onclick="assinar()">Assinar e confirmar</button></div>`;}
  const w=String((D.loja&&D.loja.whatsapp)||'').replace(/\D/g,'');if(w)h+=`<a class="btn gh" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${w.length<=11?'55'+w:w}?text=${encodeURIComponent('Olá! Sobre a vistoria do '+(P.nome||'produto')+'.')}">Falar com o vendedor</a>`;
  h+=`<div class="foot">Página gerada pelo <b>BRIQPRO</b> · a assinatura registra data, hora e dispositivo</div>`;
  $('#app').innerHTML=h;document.title='Vistoria · '+(P.nome||'produto');if(!D.assinado)setupPad();
}
function zoom(k){const m=(D.midias||[])[k];if(!m)return;$('#lbimg').src=m.url;$('#lb').classList.add('open');}
function mascara(e){let d=e.value.replace(/\D/g,'').slice(0,11);e.value=d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');}
function setupPad(){const cv=$('#pad');const r=cv.getBoundingClientRect();const dpr=window.devicePixelRatio||1;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);const x=cv.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#0B1F3A';x.fillStyle='#0B1F3A';padEmpty=true;
  let down=false,last=null;const pos=e=>{const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top};};
  cv.onpointerdown=e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}down=true;last=pos(e);x.beginPath();x.arc(last.x,last.y,1.1,0,Math.PI*2);x.fill();padEmpty=false;};
  cv.onpointermove=e=>{if(!down)return;e.preventDefault();const p=pos(e);x.beginPath();x.moveTo(last.x,last.y);x.quadraticCurveTo(last.x,last.y,(last.x+p.x)/2,(last.y+p.y)/2);x.lineTo(p.x,p.y);x.stroke();last=p;};
  cv.onpointerup=cv.onpointercancel=cv.onpointerleave=()=>{down=false;};}
function limpar(){const cv=$('#pad');cv.getContext('2d').clearRect(0,0,cv.width,cv.height);padEmpty=true;}
async function assinar(){const er=$('#err'),bt=$('#bt');er.textContent='';const nome=$('#nome').value.trim();const cpf=$('#cpf').value.trim();
  if(nome.split(/\s+/).length<2){er.textContent='Informe seu nome completo.';return;}
  if(!$('#ok').checked){er.textContent='Marque a declaração para confirmar.';return;}
  if(padEmpty){er.textContent='Faça sua assinatura no quadro branco.';return;}
  const cv=$('#pad');const t=document.createElement('canvas');const s=Math.min(1,600/cv.width);t.width=Math.round(cv.width*s);t.height=Math.round(cv.height*s);t.getContext('2d').drawImage(cv,0,0,t.width,t.height);const sig=t.toDataURL('image/png');
  bt.disabled=true;bt.textContent='Enviando assinatura…';
  try{const r=await sb.rpc('vistoria_assinar',{tok:TOK,p_nome:nome,p_cpf:cpf,p_assinatura:sig,p_ua:navigator.userAgent});if(r.error)throw r.error;const d=r.data||{};
    if(d.erro){const M={ja_assinado:'Esta vistoria já foi assinada.',nome:'Informe seu nome completo.',assinatura:'Assinatura inválida. Tente de novo.',indisponivel:'Esta vistoria não está mais disponível.'};er.textContent=M[d.erro]||'Não foi possível assinar.';bt.disabled=false;bt.textContent='Assinar e confirmar';if(d.erro==='ja_assinado')await carregar();return;}
    await carregar();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});}
  catch(e){er.textContent='Sem conexão. Tente de novo.';bt.disabled=false;bt.textContent='Assinar e confirmar';}}
async function carregar(){const r=await sb.rpc('vistoria_publica',{tok:TOK});if(r.error)throw r.error;D=r.data;if(!D){fail('Esta vistoria não está mais disponível. Fale com o vendedor.');return;}render();}
function fail(m){$('#app').innerHTML='<div class="state"><b style="color:var(--brand);font-size:18px">BRIQPRO</b><p>'+esc(m)+'</p></div>';}
(async function(){TOK=new URLSearchParams(location.search).get('t')||'';if(!/^[0-9a-f-]{36}$/i.test(TOK)){fail('Link inválido. Peça o link da vistoria ao vendedor.');return;}
  try{await carregar();}catch(e){fail('Não foi possível carregar agora. Tente de novo em instantes.');}})();
window.assinar=assinar;window.limpar=limpar;window.zoom=zoom;window.mascara=mascara;
</script>
</body>
</html>
